name: Data Engineering Lab checks

on:
  pull_request:
    paths:
      - 'de-lab/**'
      - '.github/workflows/de-lab-ci.yml'
      - 'specs/2026-10-30-de-systems-lab-prd.md'
  push:
    branches: [main]
    paths:
      - 'de-lab/**'
      - '.github/workflows/de-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-structure:
    name: Native Node tests and page invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify simulator logic, static asset routes, and accessibility hooks
        run: node --test de-lab/tests/*.test.cjs
